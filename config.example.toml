listen = "127.0.0.1:7788"
state_dir = "/var/lib/ephemera"
run_dir = "/run/ephemera"
qemu_binary = "qemu-system-x86_64"
qemu_img_binary = "qemu-img"
cloud_hypervisor_binary = "cloud-hypervisor"
cloud_localds_binary = "cloud-localds"
virt_customize_binary = "virt-customize"
firecracker_binary = "firecracker"
# firecracker_kernel = "/var/lib/ephemera/kernels/vmlinux"
# cloud_hypervisor_firmware = "/usr/share/cloud-hypervisor/CLOUDHV.fd"
default_bridge = "vmbr0"
reaper_interval_secs = 5

# Every field is optional and defaults to unrestricted — uncomment only the
# limits you want. An absent [policy] table (or this whole section commented
# out) behaves exactly like the pre-policy MVP.
# [policy]
# max_vcpus = 8
# max_memory_mib = 16384
# max_disk_gib = 100
# max_ttl_seconds = 86400          # every request must set a ttl_seconds <= this; unbounded VMs are rejected
# allowed_backends = ["qemu", "firecracker"]
# allowed_image_dirs = ["/var/lib/ephemera/images"]

# REST API bearer-token auth/RBAC. Absent or empty -> auth is off and every
# request is treated as admin (the pre-auth MVP default). GET /healthz never
# requires a token, even when auth is enabled. Generate tokens with
# something like `openssl rand -hex 32` — these are bearer secrets, treat
# them like passwords (chmod this file 0600 once you fill them in).
# [[auth.tokens]]
# token = "REPLACE_ME_ADMIN_TOKEN"
# role = "admin"
# name = "ci"
#
# [[auth.tokens]]
# token = "REPLACE_ME_READONLY_TOKEN"
# role = "read-only"
# name = "dashboard"

# Firecracker only: run every Firecracker VM through Firecracker's own
# `jailer` binary (chroot, uid/gid drop) instead of exec'ing it directly.
# Opt-in, off by default. When enabled, firecracker_binary above must be an
# absolute path (jailer's --exec-file needs a real path, not one resolved
# via $PATH), and chroot_base_dir should be on the same filesystem as
# state_dir so resource placement can hardlink instead of copying a
# multi-GB rootfs per VM.
# [jailer]
# enabled = true
# jailer_binary = "jailer"
# uid = 123
# gid = 100
# chroot_base_dir = "/srv/jailer"

# Only used by storage=ceph-rbd create requests (see "Storage backends" in
# README.md) — every other storage backend (the default qcow2/raw overlay,
# lvm-thin, nbd) needs no configuration here at all. ceph-rbd is implemented
# against the real `rbd` CLI and QEMU's native rbd: driver but has not been
# verified against a real Ceph cluster in this project's own testing.
# [storage]
# ceph_user = "admin"
# ceph_conf = "/etc/ceph/ceph.conf"
