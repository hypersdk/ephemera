[package]
name = "ephemera-api"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "REST API for Zyvor Ephemera"

[dependencies]
ephemera-core = { path = "../ephemera-core" }
ephemera-scheduler = { path = "../ephemera-scheduler" }
ephemera-image = { path = "../ephemera-image" }
ephemera-vsock-client = { path = "../ephemera-vsock-client" }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
