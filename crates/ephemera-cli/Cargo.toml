[package]
name = "ephemera-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Zyvor Ephemera command-line interface"

[dependencies]
ephemera-core = { path = "../ephemera-core" }
ephemera-scheduler = { path = "../ephemera-scheduler" }
ephemera-api = { path = "../ephemera-api" }
ephemera-image = { path = "../ephemera-image" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "ephemera"
path = "src/main.rs"
