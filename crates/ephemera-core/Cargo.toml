[package]
name = "ephemera-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared domain types, config, and VmBackend trait for Zyvor Ephemera"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ephemera-cgroup = { path = "../ephemera-cgroup" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
