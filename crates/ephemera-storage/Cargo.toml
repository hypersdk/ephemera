[package]
name = "ephemera-storage"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "VM-record state persistence for Zyvor Ephemera"

[dependencies]
ephemera-core = { path = "../ephemera-core" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
