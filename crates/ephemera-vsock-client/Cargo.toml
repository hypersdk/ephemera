[package]
name = "ephemera-vsock-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host-side dialing for the Zyvor Ephemera guest agent over AF_VSOCK"

[dependencies]
ephemera-core = { path = "../ephemera-core" }
ephemera-guest-protocol = { path = "../ephemera-guest-protocol" }
anyhow = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
