#
# One instance per ephemera-capable node, matching the "node-local
# daemonset" model crates/ephemera-kube/src/crd.rs and controller.rs are
# written for. Requires:
#   - the node labeled `ragnarok.io/ephemera-capable: "true"` (KVM-capable,
#     QEMU/CH/Firecracker tooling reachable, `nbd` kernel module loaded —
#     the last one is a host prerequisite this DaemonSet cannot satisfy
#     itself; see README.md)
#   - crd.yaml and rbac.yaml applied first
#   - VM images pre-staged under the state_dir hostPath below (no
#     k8s-native image pull path exists yet — see README.md)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ephemera-kube
  namespace: ephemera-system
  labels:
    app: ephemera-kube
spec:
  selector:
    matchLabels:
      app: ephemera-kube
  template:
    metadata:
      labels:
        app: ephemera-kube
    spec:
      serviceAccountName: ephemera-kube
      nodeSelector:
        ragnarok.io/ephemera-capable: "true"
      # TAP/bridge devices and the per-VM-netns dnsmasq DHCP server are
      # host-network-namespace objects in Ephemera's design (see
      # ephemera_network::netns and NetworkSpec::Tap) — the `ephemera`
      # container needs the pod in the host's network namespace for that to
      # mean anything, the same way ephemera.service runs directly on the
      # host rather than in a container's isolated netns. Not a hardening
      # relaxation to revisit later.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ephemera
          image: ghcr.io/zyvor/ephemera:0.1.0
          command: ["ephemera", "--config", "/etc/ephemera.toml", "serve"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN", "NET_BIND_SERVICE", "NET_RAW"]
              drop: ["ALL"]
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: netns
              mountPath: /run/netns
            - name: var-lib-ephemera
              mountPath: /var/lib/ephemera
            - name: run-ephemera
              mountPath: /run/ephemera
            - name: config
              mountPath: /etc/ephemera.toml
              subPath: ephemera.toml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7788
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7788
            initialDelaySeconds: 10
            periodSeconds: 20
        - name: ephemera-kube
          image: ghcr.io/zyvor/ephemera:0.1.0
          command: ["ephemera-kube"]
          env:
            # Must be the real Kubernetes node name — this is what a
            # DisposableVm's spec.node has to equal for this instance to
            # pick it up (see crd.rs's doc comment on `node`).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EPHEMERA_URL
              value: "http://127.0.0.1:7788"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: var-lib-ephemera
          hostPath:
            path: /var/lib/ephemera
            type: DirectoryOrCreate
        - name: run-ephemera
          hostPath:
            path: /run/ephemera
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: ephemera-config
